name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        env:
          ADMIN_USERNAME: testadmin
          ADMIN_PASSWORD: testpassword123
          MICROSERVICE_JWT_SECRET: test_ci_secret_key_1234567890
        run: |
          python -m unittest discover tests

  frontend-check:
    name: Frontend Syntax & Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: style/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: style/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check src/stores/categories.js
          node --check src/stores/products.js
          node --check src/services/api.js

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          LOCAL_DB_PASSWORD: dummy_db_password
          DB_PASSWORD: dummy_db_password
          DB_HOST: postgres
          MICROSERVICE_JWT_SECRET: dummy_secret_key_123456
          STORAGE_DATABASE_URL: postgresql://dummy
          BACKGROUND_TASK_DATABASE_URL: postgresql://dummy
        run: |
          docker compose config --quiet
