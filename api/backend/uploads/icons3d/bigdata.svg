<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="discTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#949ba9"/>
      <stop offset="100%" stop-color="#4e5361"/>
    </linearGradient>
    <linearGradient id="discSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242730"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe26a"/>
      <stop offset="100%" stop-color="#e5a900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="40" cy="67" rx="24" ry="6" fill="rgba(0,0,0,0.12)"/>

  <!-- Tier 1: Bottom Cylinder (Matte Obsidian) -->
  <path d="M18 47 L18 55 C18 61 28 66 40 66 C52 66 62 61 62 55 L62 47 C62 53 52 58 40 58 C28 58 18 53 18 47 Z" fill="url(#discSide)" stroke="#2b2e38" stroke-width="1"/>
  <ellipse cx="40" cy="47" rx="22" ry="8" fill="#2d303a" stroke="#3e434f" stroke-width="1"/>

  <!-- Tier 2: Middle Cylinder (Graphite) -->
  <path d="M18 34 L18 42 C18 48 28 53 40 53 C52 53 62 48 62 42 L62 34 C62 40 52 45 40 45 C28 45 18 40 18 34 Z" fill="url(#discSide)" stroke="#353944" stroke-width="1"/>
  <ellipse cx="40" cy="34" rx="22" ry="8" fill="#3e434f" stroke="#545a68" stroke-width="1"/>

  <!-- Tier 3: Top Hero Cylinder (Titanium Metallic Top) -->
  <path d="M18 21 L18 29 C18 35 28 40 40 40 C52 40 62 35 62 29 L62 21 C62 27 52 32 40 32 C28 32 18 27 18 21 Z" fill="url(#discSide)" stroke="#414653" stroke-width="1"/>
  <ellipse cx="40" cy="21" rx="22" ry="8" fill="url(#discTop)" stroke="#9ea5b5" stroke-width="1.3"/>

  <!-- Minimal Gold Accent (Active Query Pulse Ring between tier 1 & 2) -->
  <path d="M24 43 C27 46 33 48 40 48 C47 48 53 46 56 43" stroke="url(#goldRing)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="40" cy="48" r="2" fill="#ffffff"/>
</svg>