<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="topCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#949ba9"/>
      <stop offset="100%" stop-color="#555b6a"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe26a"/>
      <stop offset="100%" stop-color="#e5a900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="40" cy="68" rx="24" ry="6" fill="rgba(0,0,0,0.12)"/>

  <!-- Cube 1 (Bottom Left) -->
  <polygon points="24,42 36,35 48,42 36,49" fill="#585e6d" stroke="#7e8595" stroke-width="0.8"/>
  <polygon points="24,42 36,49 36,61 24,54" fill="#181a20" stroke="#2a2d36" stroke-width="0.8"/>
  <polygon points="36,49 48,42 48,54 36,61" fill="#262932" stroke="#373c47" stroke-width="0.8"/>

  <!-- Cube 2 (Bottom Right) -->
  <polygon points="44,46 56,39 68,46 56,53" fill="#4d525f" stroke="#707685" stroke-width="0.8"/>
  <polygon points="44,46 56,53 56,64 44,57" fill="#14151a" stroke="#252830" stroke-width="0.8"/>
  <polygon points="56,53 68,46 68,57 56,64" fill="#20232b" stroke="#30343e" stroke-width="0.8"/>

  <!-- Cube 3 (Elevated Hero Cube) -->
  <polygon points="38,18 52,10 66,18 52,26" fill="url(#topCubeTop)" stroke="#9ea5b5" stroke-width="1"/>
  <polygon points="38,18 52,26 52,38 38,30" fill="#181a20" stroke="#2d303a" stroke-width="1"/>
  <polygon points="52,26 66,18 66,30 52,38" fill="#282b35" stroke="#3b3f4c" stroke-width="1"/>

  <!-- Connection Link -->
  <line x1="36" y1="35" x2="44" y2="30" stroke="#4a505f" stroke-width="1.8" stroke-dasharray="2 2"/>

  <!-- Minimal Gold Active Node -->
  <polygon points="48,31 54,27 60,31 54,35" fill="url(#goldGlow)" filter="url(#glow)"/>
  <polygon points="48,31 54,35 54,39 48,35" fill="#d49800"/>
  <polygon points="54,35 60,31 60,35 54,39" fill="#f5b800"/>
</svg>