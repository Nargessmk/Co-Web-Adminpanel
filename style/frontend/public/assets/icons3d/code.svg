<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="codeBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3f4b"/>
      <stop offset="100%" stop-color="#16171e"/>
    </linearGradient>
    <linearGradient id="codePlateTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#737b8d"/>
      <stop offset="100%" stop-color="#373b47"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe26a"/>
      <stop offset="100%" stop-color="#e5a900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="40" cy="68" rx="24" ry="6" fill="rgba(0,0,0,0.12)"/>

  <!-- Back Layer (Obsidian Base Canvas) -->
  <polygon points="20,40 40,28 60,40 40,52" fill="url(#codeBaseGrad)" stroke="#353844" stroke-width="1"/>
  <polygon points="20,40 40,52 40,55 20,43" fill="#0f1014"/>
  <polygon points="40,52 60,40 60,43 40,55" fill="#181920"/>

  <!-- Front Elevated Layer (IDE / Code Terminal Window) -->
  <polygon points="22,25 42,13 64,25 44,37" fill="url(#codePlateTop)" stroke="#9299a9" stroke-width="1.3"/>
  <polygon points="22,25 44,37 44,41 22,29" fill="#181a20"/>
  <polygon points="44,37 64,25 64,29 44,41" fill="#242730"/>

  <!-- Window Controls (Traffic Lights) -->
  <circle cx="28" cy="22" r="1.3" fill="#ff5f56"/>
  <circle cx="32" cy="20" r="1.3" fill="#ffbd2e"/>
  <circle cx="36" cy="18" r="1.3" fill="#27c93f"/>

  <!-- Code Syntax Lines -->
  <line x1="41" y1="18" x2="52" y2="24" stroke="#5d6575" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="23" x2="57" y2="29" stroke="#7e8595" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Glowing Isometric Code Brackets < / > -->
  <polyline points="32,27 28,30 33,33" stroke="url(#goldAccent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="37" y1="27" x2="35" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="40,28 44,31 39,34" stroke="url(#goldAccent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Minimal Gold Active Node on Base -->
  <polygon points="48,46 54,42 60,46 54,50" fill="url(#goldAccent)" filter="url(#glow)"/>
  <polygon points="48,46 54,50 54,54 48,50" fill="#d49800"/>
  <polygon points="54,50 60,46 60,50 54,54" fill="#f5b800"/>
</svg>
