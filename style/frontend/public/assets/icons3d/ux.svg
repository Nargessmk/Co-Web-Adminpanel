<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="glassLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3f4b"/>
      <stop offset="100%" stop-color="#16171e"/>
    </linearGradient>
    <linearGradient id="glassLayer2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#737b8d"/>
      <stop offset="100%" stop-color="#373b47"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe26a"/>
      <stop offset="100%" stop-color="#e5a900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="40" cy="67" rx="24" ry="6" fill="rgba(0,0,0,0.12)"/>

  <!-- Back Layer (Obsidian Base Canvas) -->
  <polygon points="20,38 40,25 60,38 40,51" fill="url(#glassLayer1)" stroke="#353844" stroke-width="1"/>
  <polygon points="20,38 40,51 40,54 20,41" fill="#0f1014"/>
  <polygon points="40,51 60,38 60,41 40,54" fill="#181920"/>

  <!-- Front Elevated Layer (Active Interface Component) -->
  <polygon points="24,24 44,12 64,24 44,36" fill="url(#glassLayer2)" stroke="#9299a9" stroke-width="1.3"/>
  <polygon points="24,24 44,36 44,40 24,28" fill="#181a20"/>
  <polygon points="44,36 64,24 64,28 44,40" fill="#242730"/>

  <!-- Wireframe Details -->
  <line x1="32" y1="22" x2="44" y2="15" stroke="#b4bac9" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="33" cy="27" r="1.8" fill="#b4bac9"/>
  <circle cx="41" cy="31" r="1.8" fill="#b4bac9"/>

  <!-- Precision Gold Cursor -->
  <polygon points="52,26 58,25 55,31 53,28" fill="url(#goldAccent)" filter="url(#glow)"/>
  <circle cx="52" cy="26" r="1.2" fill="#ffffff"/>
</svg>