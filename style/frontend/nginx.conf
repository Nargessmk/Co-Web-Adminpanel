server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 110MB (backend multer video limit is 100MB + multipart overhead; nginx default is 1MB!)
    client_max_body_size 110m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy (^~ = prefix match wins over the regex static-asset location below)
    location ^~ /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads proxy (^~ so images under /uploads/ are proxied, not 404'd by the asset cache block)
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SEO files. These must be served as themselves, NOT swallowed by the SPA
    # history-mode fallback below: a request for /robots.txt used to return
    # index.html with `200 text/html`, so crawlers asking for a plain-text file
    # were handed the home page markup instead. `^~` makes this prefix match
    # win over the regex static-asset block.
    location = /robots.txt {
        proxy_pass http://backend:3000/robots.txt;
        proxy_set_header Host $host;
        default_type text/plain;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:3000/sitemap.xml;
        proxy_set_header Host $host;
        default_type application/xml;
    }

    # History mode routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
